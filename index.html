<!DOCTYPE html>
<html lang="en">

<head>

  <title>PEEK A BOO! Image Slide</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <ul class="list">
      <li class="item">
        <span>PEEK A BOO!</span>

          <img src="/assets/images/image_1.jpeg" alt="Image">

      </li>

        <span>Hover your</span>
        <div class="image">
          <img src="/assets/images/image_2.jpg" alt="Image">

      <li class="item">
        <span>watch the</span>

      </li>

        <span>and stretch</span>
